version: "3.9"

services:
  node:
    image: bitcoin/bitcoin:27.0
    container_name: real-mining-node
    restart: unless-stopped
    command:
      - "-regtest=1"
      - "-conf=/home/bitcoin/.bitcoin/bitcoin.conf"
      - "-rpcuser=${RPC_USER}"
      - "-rpcpassword=${RPC_PASS}"
      - "-rpcallowip=0.0.0.0/0"
      - "-rpcbind=0.0.0.0"
      - "-txindex=1"
      - "-listen=1"
      - "-port=18444"
      - "-rpcport=18443"
      - "-addnode=node"  # self-reference so later miners can connect by hostname
    volumes:
      - node_data:/home/bitcoin/.bitcoin
      - ./config/bitcoin.conf:/home/bitcoin/.bitcoin/bitcoin.conf
    ports:
      - "20443:18443"
      - "20444:18444"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=${RPC_USER}", "-rpcpassword=${RPC_PASS}", "getblockchaininfo"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  miner-controller:
    build:
      context: ./miner
    environment:
      RPC_USER: ${RPC_USER}
      RPC_PASS: ${RPC_PASS}
      RPC_HOST: ${RPC_HOST:-node}
      RPC_PORT: ${RPC_PORT}
      MINER_THREADS: ${MINER_THREADS}
      TARGET_BLOCKS: ${TARGET_BLOCKS}
      COINBASE_LABEL: ${COINBASE_LABEL}
    depends_on:
      node:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ["python", "-m", "run_mining_demo"]

volumes:
  node_data:

