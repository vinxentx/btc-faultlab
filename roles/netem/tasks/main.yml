# Achtung: kein Zugriff auf run_dir, damit keine Rekursion getriggert wird.

- name: Compute network fault set (deterministic)
  when: clear | default(false) | bool == false
  ansible.builtin.set_fact:
    all_nodes: "{{ query('sequence','start=1 end=' ~ node_count) | map('int') | list }}"
    network_fault_fraction_val: "{{ network_fault_fraction | default(1.0) | float }}"

- name: Compute network fault count
  when: clear | default(false) | bool == false
  ansible.builtin.set_fact:
    network_fault_count: "{{ (node_count * network_fault_fraction_val) | round(0,'floor') | int }}"

- name: Pick nodes for network faults (seeded shuffle, take first k)
  when: 
    - clear | default(false) | bool == false
    - network_fault_fraction_val < 1.0
  ansible.builtin.set_fact:
    network_fault_nodes_idx: "{{ (all_nodes | shuffle(seed=seed) | list)[: (network_fault_count | int)] | default([]) }}"

- name: Use all nodes for network faults (when fraction = 1.0 or not specified)
  when: 
    - clear | default(false) | bool == false
    - network_fault_fraction_val >= 1.0
  ansible.builtin.set_fact:
    network_fault_nodes_idx: "{{ all_nodes }}"

- name: Apply netem (Parallel)
  when: 
    - clear | default(false) | bool == false
    - i | int in (network_fault_nodes_idx | default(all_nodes))
  loop: "{{ range(1, node_count + 1) | list }}"
  loop_control:
    loop_var: i
  ansible.builtin.shell: |
    docker run --rm --network container:node{{ '%02d'|format(i) }} --cap-add NET_ADMIN \
      ghcr.io/nicolaka/netshoot:latest sh -lc "tc qdisc del dev eth0 root 2>/dev/null || true; \
      {% if bandwidth_mbit | default(0) | float > 0 %}
      tc qdisc add dev eth0 root handle 1: htb default 10; \
      tc class add dev eth0 parent 1: classid 1:10 htb rate {{ bandwidth_mbit }}mbit ceil {{ bandwidth_mbit }}mbit; \
      tc qdisc add dev eth0 parent 1:10 handle 10: netem delay {{ latency_ms }}ms {{ jitter_ms | default(0) }}ms loss {{ loss_pct }}%; \
      {% else %}
      tc qdisc add dev eth0 root netem delay {{ latency_ms }}ms {{ jitter_ms | default(0) }}ms loss {{ loss_pct }}%; \
      {% endif %}"
  async: 300
  poll: 0
  register: netem_apply_jobs
  changed_when: true

- name: Wait for netem application to finish
  when: clear | default(false) | bool == false
  async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ netem_apply_jobs.results | selectattr('ansible_job_id', 'defined') | list }}"
  loop_control:
    label: "node{{ '%02d'|format(item.i) }}"
  register: job_results
  until: job_results.finished
  retries: 150
  delay: 2

- name: Compute network fault set for clearing (deterministic)
  when: clear | default(false) | bool
  ansible.builtin.set_fact:
    all_nodes_clear: "{{ query('sequence','start=1 end=' ~ node_count) | map('int') | list }}"
    network_fault_fraction_clear: "{{ network_fault_fraction | default(1.0) | float }}"

- name: Compute network fault count for clearing
  when: clear | default(false) | bool
  ansible.builtin.set_fact:
    network_fault_count_clear: "{{ (node_count * network_fault_fraction_clear) | round(0,'floor') | int }}"

- name: Pick nodes for clearing network faults (seeded shuffle, take first k)
  when: 
    - clear | default(false) | bool
    - network_fault_fraction_clear < 1.0
  ansible.builtin.set_fact:
    network_fault_nodes_idx_clear: "{{ (all_nodes_clear | shuffle(seed=seed) | list)[: (network_fault_count_clear | int)] | default([]) }}"

- name: Use all nodes for clearing (when fraction = 1.0 or not specified)
  when: 
    - clear | default(false) | bool
    - network_fault_fraction_clear >= 1.0
  ansible.builtin.set_fact:
    network_fault_nodes_idx_clear: "{{ all_nodes_clear }}"

- name: Clear netem (Parallel)
  when: 
    - clear | default(false) | bool
    - i | int in (network_fault_nodes_idx_clear | default(all_nodes_clear))
  loop: "{{ range(1, node_count + 1) | list }}"
  loop_control:
    loop_var: i
  ansible.builtin.shell: |
    docker run --rm --network container:node{{ '%02d'|format(i) }} --cap-add NET_ADMIN \
      ghcr.io/nicolaka/netshoot:latest sh -lc "tc qdisc del dev eth0 root 2>/dev/null || true"
  async: 300
  poll: 0
  register: netem_clear_jobs
  changed_when: true

- name: Wait for netem clearing to finish
  when: clear | default(false) | bool
  async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ netem_clear_jobs.results | selectattr('ansible_job_id', 'defined') | list }}"
  loop_control:
    label: "node{{ '%02d'|format(item.i) }}"
  register: job_results
  until: job_results.finished
  retries: 150
  delay: 2
