- name: Ensure config dir exists
  ansible.builtin.file:
    path: "{{ workdir }}/config"
    state: directory
    mode: "0755"
    owner: "{{ lookup('env','USER') }}"
    group: "{{ file_group }}"

- name: Ensure per-node config dirs exist
  ansible.builtin.file:
    path: "{{ workdir }}/config/node{{ '%02d'|format(item) }}"
    state: directory
    mode: "0755"
    owner: "{{ lookup('env','USER') }}"
    group: "{{ file_group }}"
  loop: "{{ range(1, (node_count | int) + 1) | list }}"

- name: Build wallet service list
  ansible.builtin.set_fact:
    wallet_services: "{{ [wallet_funding_container] + (txgen_shards | map(attribute='wallet_container') | list) }}"

- name: Ensure wallet config dirs exist
  ansible.builtin.file:
    path: "{{ workdir }}/config/{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ lookup('env','USER') }}"
    group: "{{ file_group }}"
  loop: "{{ wallet_services }}"

- name: Generate network topology
  ansible.builtin.command: >
    python3 {{ workdir }}/files/topology_generator.py
    --node-count {{ node_count }}
    --seed {{ seed }}
    --mode {{ topology_mode | default('hybrid') }}
    --k {{ topology_k | default(4) }}
  register: topology_result
  changed_when: false

- name: Parse topology JSON
  ansible.builtin.set_fact:
    network_topology: "{{ topology_result.stdout | from_json }}"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ workdir }}/docker-compose.yml"

- name: Precreate and chown named volumes (Parallel)
  ansible.builtin.shell: |
    # Node volumes
    for i in $(seq -f "%02g" 1 {{ node_count }}); do
      (
        vol="{{ network_name }}_node${i}_data"
        docker volume create "$vol" >/dev/null
        docker run --rm -u 0:0 -v "$vol":/data alpine:3.19 sh -lc "mkdir -p /data && chown -R 101:101 /data"
      ) &
    done
    # Wallet volumes
    {% for item in wallet_services %}
    (
      vol="{{ network_name }}_{{ item }}_data"
      docker volume create "$vol" >/dev/null
      docker run --rm -u 0:0 -v "$vol":/data alpine:3.19 sh -lc "mkdir -p /data && chown -R 101:101 /data"
    ) &
    {% endfor %}
    # txgen log volumes
    {% for item in txgen_shards %}
    docker volume create "{{ network_name }}_txlogs_{{ item.log_suffix }}" >/dev/null &
    {% endfor %}
    wait
  changed_when: true

- name: Render per-node bitcoin.conf files
  ansible.builtin.template:
    src: "bitcoin.conf.j2"
    dest: "{{ workdir }}/config/node{{ '%02d'|format(item) }}/bitcoin.conf"
    mode: "0644"
    owner: "{{ lookup('env','USER') }}"
    group: "{{ file_group }}"
  loop: "{{ range(1, (node_count | int) + 1) | list }}"
  loop_control:
    label: "node{{ '%02d'|format(item) }}"

- name: Render wallet bitcoin.conf files
  ansible.builtin.template:
    src: "bitcoin.conf.j2"
    dest: "{{ workdir }}/config/{{ item }}/bitcoin.conf"
    mode: "0644"
    owner: "{{ lookup('env','USER') }}"
    group: "{{ file_group }}"
  loop: "{{ wallet_services }}"

- name: Ensure results dir exists
  ansible.builtin.file:
    path: "{{ workdir }}/results"
    state: directory
    mode: "0755"
    owner: "{{ lookup('env','USER') }}"
    group: "{{ file_group }}"

- name: Ensure state dir exists
  ansible.builtin.file:
    path: "{{ workdir }}/state"
    state: directory
    mode: "0755"
    owner: "{{ lookup('env','USER') }}"
    group: "{{ file_group }}"

- name: Clear stale mining config from previous runs
  ansible.builtin.file:
    path: "{{ workdir }}/state/mining_targets.json"
    state: absent

