- name: Compute crash set (deterministic)
  ansible.builtin.set_fact:
    all_nodes: "{{ query('sequence','start=1 end=' ~ node_count) | map('int') | list }}"
    crash_count: "{{ (node_count * crash_fraction) | round(0,'floor') | int }}"

- name: Pick nodes to crash (seeded shuffle, take first k)
  ansible.builtin.set_fact:
    crash_nodes_idx: "{{ (all_nodes | shuffle(seed=seed) | list)[: (crash_count | int)] | default([]) }}"
  when: (crash_count | int) > 0

- name: Expand to names
  ansible.builtin.set_fact:
    crash_nodes: []
  when: (crash_count | int) > 0

- name: Build crash_nodes list (format node names)
  when: (crash_count | int) > 0
  loop: "{{ crash_nodes_idx | default([]) }}"
  loop_control: { loop_var: idx }
  ansible.builtin.set_fact:
    crash_nodes: "{{ (crash_nodes | default([])) + ['node' ~ ('%02d'|format(idx))] }}"

- name: Log crash plan (workdir-global)
  when: (crash_count | int) > 0
  ansible.builtin.shell: |
    mkdir -p "{{ workdir }}/results"
    echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) crash_plan nodes={{ crash_nodes | default([]) | join(',') }} mode={{ crash_mode }} duration={{ crash_duration_s }}s" >> "{{ workdir }}/results/events.log"
  changed_when: true


- name: Burst crash
  when:
    - (crash_count | int) > 0
    - crash_mode == "burst"
  loop: "{{ crash_nodes }}"
  loop_control: { loop_var: c }
  ansible.builtin.shell: "docker stop {{ c }}"

- name: Staggered crash
  when:
    - (crash_count | int) > 0
    - crash_mode == "staggered"
  loop: "{{ crash_nodes }}"
  loop_control: { loop_var: c }
  ansible.builtin.shell: "docker stop {{ c }} && sleep {{ (crash_duration_s / (crash_nodes|length|default(1))) | int }}"

- name: Pause while crashed
  when: (crash_count | int) > 0
  ansible.builtin.pause: { seconds: "{{ crash_duration_s }}" }

# Recovery start
- name: Recovery with full resync (reindex blockchain)
  when:
    - (crash_count | int) > 0
    - recovery_mode == "full_resync"
    - reindex_on_restart | default(false) | bool
  loop: "{{ crash_nodes }}"
  loop_control: { loop_var: c }
  ansible.builtin.shell: |
    # Start container
    docker start {{ c }}
    sleep 2
    # Stop bitcoind and restart with -reindex
    docker exec {{ c }} bitcoin-cli -regtest stop 2>/dev/null || true
    sleep 2
    docker exec {{ c }} bitcoind -regtest -reindex -daemon

- name: Recovery with fast resync (no reindex)
  when:
    - (crash_count | int) > 0
    - recovery_mode == "fast_resync" or (reindex_on_restart | default(false) | bool == false)
  loop: "{{ crash_nodes }}"
  loop_control: { loop_var: c }
  ansible.builtin.shell: |
    docker start {{ c }}

# Log recovery start
- name: Log recovery start timestamp
  when: (crash_count | int) > 0
  ansible.builtin.shell: |
    echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) recovery_start nodes={{ crash_nodes | default([]) | join(',') }}" >> "{{ run_dir }}/events.log"
  changed_when: true

# Wait for recovered nodes to finish syncing (using initialblockdownload RPC)
- name: Wait for recovered nodes to complete blockchain sync
  when: (crash_count | int) > 0
  loop: "{{ crash_nodes }}"
  loop_control: { loop_var: c }
  ansible.builtin.shell: |
    docker exec {{ c }} bitcoin-cli -regtest getblockchaininfo | jq -r '.initialblockdownload'
  register: ibd_status
  until: ibd_status.stdout == "false"
  retries: 120
  delay: 2
  failed_when: false

# Log recovery completion
- name: Log recovery completion timestamp
  when: (crash_count | int) > 0
  ansible.builtin.shell: |
    echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) recovery_complete nodes={{ crash_nodes | default([]) | join(',') }}" >> "{{ run_dir }}/events.log"
  changed_when: true
