# =============================================================================
# Experiment Role: Crash Injection and Recovery
# =============================================================================
# This role handles:
# - Deterministic node selection for crashes (seeded)
# - Burst mode: All nodes crash simultaneously
# - Staggered mode: Nodes crash with time delays (rolling wave)
# - Recovery with configurable sync modes
# - Precise event logging for scientific analysis
#
# Event Timeline (scientific):
#   crash_start     → Beginning of crash injection
#   crash_complete  → All nodes are stopped (container status verified)
#   [pause]         → Downtime period (crash_duration_s)
#   recovery_start  → First container successfully started (process running)
#   recovery_complete → All nodes synchronized (height >= network, peers > 0)
#
# Key Metrics:
#   Downtime = crash_complete - crash_start + pause duration
#   Technical Recovery Time = recovery_complete - recovery_start
#   Total Recovery Time = recovery_complete - crash_start
# =============================================================================

- name: Compute crash set (deterministic)
  ansible.builtin.set_fact:
    all_nodes: "{{ query('sequence','start=1 end=' ~ node_count) | map('int') | list }}"
    crash_count: "{{ (node_count * crash_fraction) | round(0,'floor') | int }}"

- name: Pick nodes to crash (seeded shuffle, take first k)
  ansible.builtin.set_fact:
    crash_nodes_idx: "{{ (all_nodes | shuffle(seed=seed) | list)[: (crash_count | int)] | default([]) }}"
  when: (crash_count | int) > 0

- name: Expand to names
  ansible.builtin.set_fact:
    crash_nodes: []
  when: (crash_count | int) > 0

- name: Build crash_nodes list (format node names)
  when: (crash_count | int) > 0
  loop: "{{ crash_nodes_idx | default([]) }}"
  loop_control: { loop_var: idx }
  ansible.builtin.set_fact:
    crash_nodes: "{{ (crash_nodes | default([])) + ['node' ~ ('%02d'|format(idx))] }}"

# =============================================================================
# EVENT: crash_start - Marks the beginning of crash injection
# Scientific: Logged BEFORE first docker stop
# =============================================================================
- name: Log crash_start event
  when: (crash_count | int) > 0
  environment:
    RUN_DIR: "{{ run_dir }}"
    CRASH_NODES: "{{ crash_nodes | default([]) | join(',') }}"
    CRASH_MODE: "{{ crash_mode }}"
    CRASH_DURATION: "{{ crash_duration_s }}"
  ansible.builtin.shell: |
    echo "$(python3 -c 'import time; print(f"{time.time():.6f}")') crash_start mode=${CRASH_MODE} duration=${CRASH_DURATION}s nodes=${CRASH_NODES}" >> "${RUN_DIR}/events.log"
  changed_when: true

# =============================================================================
# CRASH INJECTION: Unified Async Logic for Burst and Staggered
# =============================================================================
- name: Calculate interval
  when: (crash_count | int) > 0
  ansible.builtin.set_fact:
    # Staggered uses calculated interval, Burst uses 0 (simultaneous)
    # Use stagger_period_s if provided, otherwise default to crash_duration_s
    effective_interval_s: "{{ (crash_mode == 'staggered') | ternary(((stagger_period_s | default(crash_duration_s | float)) | float) / (crash_nodes | length | default(1)), 0) }}"

- name: Inject crashes (Async)
  when: (crash_count | int) > 0
  async: 3600
  poll: 0
  loop: "{{ crash_nodes }}"
  loop_control: 
    loop_var: c
    index_var: i
  ansible.builtin.shell: |
    # Wait for my turn (0s for burst, i*interval for staggered)
    sleep $(python3 -c "print({{ i }} * {{ effective_interval_s }})")
    
    # Log individual node crash event
    echo "$(python3 -c 'import time; print(f"{time.time():.6f}")') node_crash node={{ c }} index={{ i }}" >> "{{ run_dir }}/events.log"
    docker stop {{ c }}

# EVENT: crash_complete - Logged when the last node has started stopping
- name: Log crash_complete event
  when: (crash_count | int) > 0
  async: 3600
  poll: 0
  environment:
    RUN_DIR: "{{ run_dir }}"
    LAST_NODE: "{{ crash_nodes | last }}"
  ansible.builtin.shell: |
    until grep -q "node_crash node=${LAST_NODE}" "${RUN_DIR}/events.log"; do
      sleep 0.5
    done
    # Small buffer to ensure docker stop command was at least received
    sleep 1
    echo "$(python3 -c 'import time; print(f"{time.time():.6f}")') crash_complete" >> "${RUN_DIR}/events.log"
  changed_when: true

# =============================================================================
# RECOVERY: Unified Logic (Full Resync / Fast Resync)
# Each node waits individually for its crash_duration_s to pass
# =============================================================================
- name: Recovery with full resync (reindex blockchain)
  when:
    - (crash_count | int) > 0
    - recovery_mode == "full_resync"
    - reindex_on_restart | default(false) | bool
  async: 7200 # Allow up to 2 hours for full resync
  poll: 0      # Fire and forget to allow parallel recovery
  loop: "{{ crash_nodes | default([]) }}"
  loop_control: 
    loop_var: c
    index_var: node_idx
  ignore_errors: yes
  environment:
    RUN_DIR: "{{ run_dir | default('') }}"
    CRASH_DURATION: "{{ crash_duration_s | default(0) }}"
  ansible.builtin.shell: |
    # Individual recovery: each node waits until exactly crash_duration_s after its crash
    # 1. Wait until this node has actually crashed (event exists in log)
    until grep -q "node_crash node={{ c }}" "${RUN_DIR}/events.log"; do
      sleep 0.2
    done

    # 2. Calculate remaining wait time
    NODE_CRASH_LINE=$(grep "node_crash node={{ c }}" "${RUN_DIR}/events.log" | tail -1)
    NODE_CRASH_TIME=$(echo "$NODE_CRASH_LINE" | awk '{print $1}')
    
    # Calculate wait time using python in a one-liner
    WAIT_SECONDS=$(python3 -c "import sys, datetime
raw = sys.argv[1].strip()
duration_s = float(sys.argv[2])
try:
    crash_epoch = float(raw)
    value = abs(crash_epoch)
    if value >= 1e18:
        crash_epoch /= 1e9
    elif value >= 1e15:
        crash_epoch /= 1e6
    elif value >= 1e12:
        crash_epoch /= 1e3
    crash_time = datetime.datetime.fromtimestamp(crash_epoch, tz=datetime.timezone.utc)
except ValueError:
    crash_time = datetime.datetime.fromisoformat(raw.replace('Z', '+00:00'))
    if crash_time.tzinfo is None:
        crash_time = crash_time.replace(tzinfo=datetime.timezone.utc)
    else:
        crash_time = crash_time.astimezone(datetime.timezone.utc)
now = datetime.datetime.now(datetime.timezone.utc)
print(max(0, int(duration_s - (now - crash_time).total_seconds())))" "$NODE_CRASH_TIME" "$CRASH_DURATION")
    
    if [ "$WAIT_SECONDS" -gt 0 ] 2>/dev/null; then
      echo "Node {{ c }} waiting ${WAIT_SECONDS}s for equal downtime..."
      sleep "$WAIT_SECONDS"
    fi

    # Start container - bitcoind starts automatically via entrypoint
    # Config contains reindex=1 when reindex_on_restart is true (set during deploy)
    docker start {{ c }}
    
    # Log individual node recovery start
    echo "$(python3 -c 'import time; print(f"{time.time():.6f}")') recovery_node_start node={{ c }} index={{ node_idx }}" >> "${RUN_DIR}/events.log"

    # Log recovery_start after FIRST successful container restart
    {% if node_idx == 0 %}
    echo "$(python3 -c 'import time; print(f"{time.time():.6f}")') recovery_start nodes={{ crash_nodes | default([]) | join(',') }}" >> "${RUN_DIR}/events.log"
    {% endif %}
    
    echo "✓ Recovery started for {{ c }} (reindex via config)"
  register: full_resync_jobs

# =============================================================================
# RECOVERY: Fast resync mode (no reindex)
# Scientific: recovery_start is logged AFTER first successful container start
# =============================================================================
- name: Recovery with fast resync (no reindex)
  when:
    - (crash_count | int) > 0
    - recovery_mode == "fast_resync" or (reindex_on_restart | default(false) | bool == false)
  async: 3600
  poll: 0
  loop: "{{ crash_nodes | default([]) }}"
  loop_control: 
    loop_var: c
    index_var: node_idx
  environment:
    RUN_DIR: "{{ run_dir | default('') }}"
    CRASH_DURATION: "{{ crash_duration_s | default(0) }}"
  ansible.builtin.shell: |
    # Individual recovery: each node waits until exactly crash_duration_s after its crash
    # 1. Wait until this node has actually crashed (event exists in log)
    until grep -q "node_crash node={{ c }}" "${RUN_DIR}/events.log"; do
      sleep 0.2
    done

    # 2. Calculate remaining wait time
    NODE_CRASH_LINE=$(grep "node_crash node={{ c }}" "${RUN_DIR}/events.log" | tail -1)
    NODE_CRASH_TIME=$(echo "$NODE_CRASH_LINE" | awk '{print $1}')
    
    # Calculate wait time using python in a one-liner
    WAIT_SECONDS=$(python3 -c "import sys, datetime
raw = sys.argv[1].strip()
duration_s = float(sys.argv[2])
try:
    crash_epoch = float(raw)
    value = abs(crash_epoch)
    if value >= 1e18:
        crash_epoch /= 1e9
    elif value >= 1e15:
        crash_epoch /= 1e6
    elif value >= 1e12:
        crash_epoch /= 1e3
    crash_time = datetime.datetime.fromtimestamp(crash_epoch, tz=datetime.timezone.utc)
except ValueError:
    crash_time = datetime.datetime.fromisoformat(raw.replace('Z', '+00:00'))
    if crash_time.tzinfo is None:
        crash_time = crash_time.replace(tzinfo=datetime.timezone.utc)
    else:
        crash_time = crash_time.astimezone(datetime.timezone.utc)
now = datetime.datetime.now(datetime.timezone.utc)
print(max(0, int(duration_s - (now - crash_time).total_seconds())))" "$NODE_CRASH_TIME" "$CRASH_DURATION")
    
    if [ "$WAIT_SECONDS" -gt 0 ] 2>/dev/null; then
      echo "Node {{ c }} waiting ${WAIT_SECONDS}s for equal downtime..."
      sleep "$WAIT_SECONDS"
    fi

    docker start {{ c }}

    # Log individual node recovery start
    echo "$(python3 -c 'import time; print(f"{time.time():.6f}")') recovery_node_start node={{ c }} index={{ node_idx }}" >> "${RUN_DIR}/events.log"

    # Log recovery_start after FIRST successful container start
    {% if node_idx == 0 %}
    echo "$(python3 -c 'import time; print(f"{time.time():.6f}")') recovery_start nodes={{ crash_nodes | default([]) | join(',') }}" >> "${RUN_DIR}/events.log"
    {% endif %}
  register: fast_resync_jobs

# =============================================================================
# SYNC WAIT: Wait for ALL recovered nodes to finish syncing
# Uses a ROBUST Python script to avoid Ansible/Bash escaping and race conditions
# =============================================================================
- name: Find healthy reference nodes (Sampling for stability)
  when: (crash_count | int) > 0
  ansible.builtin.set_fact:
    # Take up to 3 healthy nodes as a reference group
    reference_nodes: "{{ (query('sequence', 'start=1 end=' ~ node_count, format='node%02d') | list | difference(crash_nodes))[:3] | list }}"

- name: Wait for ALL recovered nodes to sync (Python script)
  when: (crash_count | int) > 0
  ansible.builtin.shell: |
    python3 files/wait_for_sync.py "{{ run_dir }}" "{{ crash_nodes | join(',') }}" "{{ reference_nodes | join(',') }}"
  args:
    chdir: "{{ workdir }}"
  register: sync_result

# =============================================================================
# EVENT: recovery_complete - All nodes synchronized
# Scientific: Node height >= network height AND peers > 0
# =============================================================================
- name: Log recovery_complete event
  when: (crash_count | int) > 0
  environment:
    RUN_DIR: "{{ run_dir }}"
    CRASH_NODES: "{{ crash_nodes | default([]) | join(',') }}"
  ansible.builtin.shell: |
    echo "$(python3 -c 'import time; print(f"{time.time():.6f}")') recovery_complete nodes=${CRASH_NODES}" >> "${RUN_DIR}/events.log"
  changed_when: true
