# --- THESIS-OPTIMIZED DEFAULTS ---
# Use these settings for publication-quality experiments

# --- Topologie & Last ---
node_count: 32
tx_rate: 10
regions: ["eu","us"]

# --- Network Topology ---
# Modes: "hierarchical" (3-tier) | "hybrid" (core mesh + k-regular random)
topology_mode: "hybrid"
topology_k: 4                    # Non-core node degree for hybrid mode

# --- Fault Injection ---
crash_fraction: 0.30
crash_duration_s: 300
crash_mode: "burst"          # "burst" | "staggered"

# --- Recovery ---
recovery_mode: "cold"        # "cold" | "fast"
reindex_on_restart: "{{ recovery_mode == 'cold' }}"

# --- Omission / Netzqualität (REALISTIC, NOT AGGRESSIVE) ---
loss_pct: 2                  # 2% packet loss (was 5% - too aggressive)
latency_ms: 100              # 100ms latency (was 200ms - more realistic)
bandwidth_mbit: 10

# --- Bitcoin ---
image: "bitcoin/bitcoin:27.0"
mining_percentage: 1.0  # Alle Nodes als Miner (für realistische Crash-Effekte auf Blockzeit)

network_name: "btcnet"
# Projektwurzel = Ordner über playbooks/
workdir: "{{ playbook_dir | realpath | dirname }}"

# --- Wallet- & Generator-Topologie ---
wallet_funding_container: "wallet_funding"
wallet_funding_name: "funding"
wallet_descriptor_pool_size: 800         # Zielanzahl an bestätigten UTXOs pro Shard
wallet_descriptor_amount_btc: 0.001      # Betrag pro vorbereiteter UTXO (erhöht für Gebühren-Headroom)
funding_confirmation_blocks: 12          # Blöcke zur Bestätigung nach Verteilung

wallet_rpc_base: 21043
wallet_rpc_step: 10

txgen_shards:
  - id: "a"
    wallet_container: "wallet_shard_a"
    wallet_name: "txshard_a"
    log_suffix: "a"
  - id: "b"
    wallet_container: "wallet_shard_b"
    wallet_name: "txshard_b"
    log_suffix: "b"
  - id: "c"
    wallet_container: "wallet_shard_c"
    wallet_name: "txshard_c"
    log_suffix: "c"
  - id: "d"
    wallet_container: "wallet_shard_d"
    wallet_name: "txshard_d"
    log_suffix: "d"
  - id: "e"
    wallet_container: "wallet_shard_e"
    wallet_name: "txshard_e"
    log_suffix: "e"
  - id: "f"
    wallet_container: "wallet_shard_f"
    wallet_name: "txshard_f"
    log_suffix: "f"
  - id: "g"
    wallet_container: "wallet_shard_g"
    wallet_name: "txshard_g"
    log_suffix: "g"
  - id: "h"
    wallet_container: "wallet_shard_h"
    wallet_name: "txshard_h"
    log_suffix: "h"

txgen_address_pool_size: 2048           # Anzahl vorbereiteter Zieladressen pro Shard
txgen_address_reuse_window: 100         # Nur jede 100. TX ruft getnewaddress auf
txgen_send_amount_btc: 0.00001          # Zielbetrag pro Transaktion (reduziert für bessere UTXO-Nutzung)

block_scheduler_interval_s: 16           # Blocktakt in Sekunden
block_scheduler_seed: 1337              # Deterministischer Seed für Miner-Rotation
block_scheduler_use_variance: false     # true = Exponentialverteilung (wie echtes BTC-Netzwerk)
block_scheduler_min_interval: 2.0       # Minimales Block-Intervall bei Varianz (Shifted Exponential)
                                        # Verhindert Race-Conditions durch zu kurze Intervalle
                                        # Empfohlen: 2.0s für 16s Blockzeit (eliminiert Forks)
block_scheduler_adaptive_interval: true # Dynamische Blockzeit-Anpassung bei Crashes (simuliert Hash-Power-Verlust)
block_scheduler_health_check_interval: 5.0  # Health-Check alle 5s (schneller als typische Crash-Dauern)

node_rpc_base: 20443
node_rpc_step: 4

# --- OS-spezifische Gruppe (macOS vs Linux) ---
# macOS verwendet "staff", Linux/Ubuntu verwendet USER-Gruppe
file_group: "{{ 'staff' if ansible_os_family == 'Darwin' else lookup('env', 'USER') }}"

rpc_user: "user"
rpc_pass: "pass"
zmq_block: "tcp://0.0.0.0:28332"
zmq_tx: "tcp://0.0.0.0:28333"

# --- Phasen (Sekunden) - OPTIMIZED FOR FULL RECOVERY OBSERVATION ---
warmup_s: 120                # 2 min warmup
observe_s: 480               # 8 min observation (was 10 min)
cooldown_s: 60               # 1 min cooldown

# --- Reproduzierbarkeit ---
seed: 42
