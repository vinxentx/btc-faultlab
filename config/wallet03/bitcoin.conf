[regtest]
# RPC Settings
server=1
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0
rpcuser=user
rpcpassword=pass

# Fee Settings
fallbackfee=0.0002

# Mempool Settings
maxmempool=500

# UTXO Management - REALISTIC BEHAVIOR
# spendzeroconfchange=0 is DEFAULT (disabled)
# We do NOT enable spendzeroconfchange - wallets wait for confirmations
# This reflects production Bitcoin wallet behavior

# Performance Optimizations
dbcache=450
par=4
maxconnections=128

