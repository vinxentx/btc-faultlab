- hosts: controller
  gather_facts: true  # Wichtig für OS-Erkennung (ansible_os_family)
  vars:
    run_id: "{{ lookup('pipe','date -u +%Y%m%dT%H%M%SZ') }}"
    run_dir: "{{ workdir }}/results/{{ run_id }}"
  tasks:
    - name: Generate timestamp
      ansible.builtin.set_fact:
        timestamp: "{{ lookup('pipe','date -u +%Y%m%dT%H%M%SZ') }}"
    
    - name: Generate run_id with experiment name if available
      ansible.builtin.set_fact:
        run_id: "{{ (experiment_name | default('')) | replace('_', '-') | lower }}-{{ timestamp }}"
      when: experiment_name is defined and experiment_name | length > 0
    
    - name: Generate run_id with timestamp only (fallback)
      ansible.builtin.set_fact:
        run_id: "{{ timestamp }}"
      when: experiment_name is not defined or experiment_name | length == 0
    
    - name: Freeze run_id (compute once)
      ansible.builtin.set_fact:
        run_id: "{{ run_id if run_id is defined and run_id | length > 0 else timestamp }}"

    - name: Freeze run_dir based on frozen run_id
      ansible.builtin.set_fact:
        run_dir: "{{ workdir }}/results/{{ run_id }}"

    - name: Ensure base results directory exists and is writable by user
      ansible.builtin.file:
        path: "{{ workdir }}/results"
        state: directory
        mode: "0755"
        owner: "{{ lookup('env','USER') }}"
        group: "{{ file_group }}"

    - name: Create run directory
      ansible.builtin.file:
        path: "{{ run_dir }}/plots"
        state: directory
        mode: "0755"
        recurse: true
        owner: "{{ lookup('env','USER') }}"
        group: "{{ file_group }}"

    - name: Touch events.log
      ansible.builtin.file:
        path: "{{ run_dir }}/events.log"
        state: touch
        mode: "0644"

    - name: Write metadata.yml (parameters snapshot)
      ansible.builtin.copy:
        dest: "{{ run_dir }}/metadata.yml"
        content: |
          run_id: {{ run_id }}
          experiment_name: {{ experiment_name | default('unknown') }}
          node_count: {{ node_count }}
          tx_rate: {{ tx_rate }}
          wallet_descriptor_pool_size: {{ wallet_descriptor_pool_size | default(800) }}
          block_scheduler_interval_s: {{ block_scheduler_interval_s | default(16) }}
          block_scheduler_use_variance: {{ block_scheduler_use_variance | default(false) }}
          block_scheduler_min_interval: {{ block_scheduler_min_interval | default(2.0) }}
          block_scheduler_adaptive_interval: {{ block_scheduler_adaptive_interval | default(true) }}
          block_scheduler_health_check_interval: {{ block_scheduler_health_check_interval | default(5.0) }}
          mining_percentage: {{ mining_percentage | default(1.0) }}
          crash_fraction: {{ crash_fraction }}
          crash_duration_s: {{ crash_duration_s }}
          crash_mode: {{ crash_mode }}
          stagger_period_s: {{ stagger_period_s | default('N/A') }}
          recovery_mode: {{ recovery_mode }}
          reindex_on_restart: {{ reindex_on_restart }}
          loss_pct: {{ loss_pct }}
          latency_ms: {{ latency_ms }}
          bandwidth_mbit: {{ bandwidth_mbit }}
          jitter_ms: {{ jitter_ms | default(0) }}
          network_fault_fraction: {{ network_fault_fraction | default(1.0) }}
          block_size_limit: {{ block_size_limit | default('1MB') }}
          confirmations_for_latency_metric: {{ confirmations_for_latency_metric | default(6) }}
          warmup_s: {{ warmup_s }}
          observe_s: {{ observe_s }}
          cooldown_s: {{ cooldown_s }}
          pre_crash_delay_s: {{ pre_crash_delay_s | default(30) }}
          seed: {{ seed }}

    - name: Validiere Funding-Snapshot vor Start
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json
        import sys
        from pathlib import Path

        snapshot = Path("{{ workdir }}/state/funding_snapshot.json")
        if not snapshot.exists():
            sys.stderr.write("Funding-Snapshot fehlt: " + str(snapshot) + "\n")
            sys.exit(1)

        data = json.loads(snapshot.read_text())
        expected = {{ wallet_descriptor_pool_size }}
        for shard in data.get("shards", []):
            confirmed = shard.get("confirmed", 0)
            shard_id = shard.get("id", "unknown")
            if confirmed < expected:
                sys.stderr.write(f"Shard {shard_id} hat nur {confirmed} bestätigte UTXOs (erwartet ≥ {expected})\n")
                sys.exit(1)
        PY
      changed_when: false

    - name:  Log_event - start_warmup
      ansible.builtin.shell: |
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) start_warmup" >> "{{ run_dir }}/events.log"

    - name: Apply net impairments DURING warmup (scientific fix - network stabilization)
      include_role: { name: netem }
      vars: { run_dir: "{{ run_dir }}" }

    - name: Log_event - netem_applied
      ansible.builtin.shell: |
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) netem_applied loss={{ loss_pct }}% latency={{ latency_ms }}ms bw={{ bandwidth_mbit }}mbit jitter={{ jitter_ms | default(0) }}ms" >> "{{ run_dir }}/events.log"

    - name: Start mempool monitoring in background
      ansible.builtin.shell: |
        python3 files/mempool_monitor.py \
          --node-count {{ node_count }} \
          --interval {{ mempool_interval | default(2) }} \
          --workers {{ mempool_workers | default(32) }} \
          --output "{{ workdir }}/state/mempool_timeseries.csv" > "{{ workdir }}/state/mempool_monitor.log" 2>&1 &
        echo $! > "{{ workdir }}/state/mempool_monitor.pid"
      args:
        chdir: "{{ workdir }}"
      changed_when: true

    - name: Warm-up (network stabilization under degraded conditions)
      ansible.builtin.pause: { seconds: "{{ warmup_s }}" }

    - name: Log_event - start_observation
      ansible.builtin.shell: |
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) start_observation" >> "{{ run_dir }}/events.log"

    # ==========================================================================
    # CRASH INJECTION: Runs ASYNC during observation window
    # This allows observe_s to be a fixed window regardless of crash duration
    # ==========================================================================
    - name: Start crash manager (async - runs during observation)
      when: (crash_fraction | float) > 0
      async: 7200  # Allow up to 2 hours for crash + recovery
      poll: 0      # Don't wait - let observation timer run independently
      ansible.builtin.shell: |
        python3 files/crash_manager.py \
          --run-dir "{{ run_dir }}" \
          --node-count {{ node_count }} \
          --crash-fraction {{ crash_fraction }} \
          --crash-duration {{ crash_duration_s }} \
          --crash-mode {{ crash_mode }} \
          {% if stagger_period_s is defined %}--stagger-period {{ stagger_period_s }}{% endif %} \
          --seed {{ seed }} \
          --pre-crash-delay {{ pre_crash_delay_s | default(30) }} \
          >> "{{ run_dir }}/crash_manager.log" 2>&1
      args:
        chdir: "{{ workdir }}"
      register: crash_manager_job

    # ==========================================================================
    # OBSERVATION WINDOW: Fixed duration, crash/recovery happens within it
    # ==========================================================================
    - name: Observation period (fixed window - crash happens during this)
      ansible.builtin.pause: { seconds: "{{ observe_s }}" }

    - name: Remove net impairments
      include_role: { name: netem }
      vars: { clear: true, run_dir: "{{ run_dir }}" }

    - name: Log_event - end_observation_start_cooldown
      ansible.builtin.shell: |
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) end_observe" >> "{{ run_dir }}/events.log"

    - name: Cool-down
      ansible.builtin.pause: { seconds: "{{ cooldown_s }}" }

    - name: Stop mempool monitoring (graceful shutdown)
      ansible.builtin.shell: |
        if [ -f "{{ workdir }}/state/mempool_monitor.pid" ]; then
          PID=$(cat "{{ workdir }}/state/mempool_monitor.pid")
          # Send SIGTERM for graceful shutdown
          kill -TERM "$PID" 2>/dev/null || true
          # Wait up to 5 seconds for graceful exit
          for i in 1 2 3 4 5; do
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          # Force kill if still running
          kill -9 "$PID" 2>/dev/null || true
          rm -f "{{ workdir }}/state/mempool_monitor.pid"
        fi
      changed_when: false
      failed_when: false
