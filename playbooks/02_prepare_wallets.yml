- hosts: controller
  gather_facts: false
  vars:
    funding_host_port: "127.0.0.1:{{ wallet_rpc_base }}"
  tasks:
    - name: Build base argv for funding setup
      ansible.builtin.set_fact:
        funding_setup_argv:
          - python3
          - "{{ workdir }}/files/funding_setup.py"
          - "--rpc-user"
          - "{{ rpc_user }}"
          - "--rpc-pass"
          - "{{ rpc_pass }}"
          - "--funding-host"
          - "{{ funding_host_port }}"
          - "--funding-wallet"
          - "{{ wallet_funding_name }}"
          - "--node-count"
          - "{{ node_count | string }}"
          - "--mining-percentage"
          - "{{ mining_percentage | string }}"
          - "--utxo-per-shard"
          - "{{ wallet_descriptor_pool_size | string }}"
          - "--utxo-amount"
          - "{{ '%0.8f' | format(wallet_descriptor_amount_btc) }}"
          - "--address-batch"
          - "50"
          - "--confirmation-blocks"
          - "{{ funding_confirmation_blocks | string }}"
          - "--state-dir"
          - "{{ workdir }}/state"
          - "--scheduler-config"
          - "{{ workdir }}/state/mining_targets.json"
          - "--summary-file"
          - "{{ workdir }}/state/funding_snapshot.json"
          - "--scheduler-interval"
          - "{{ block_scheduler_interval_s | string }}"
          - "--scheduler-seed"
          - "{{ block_scheduler_seed | string }}"
          - "--miner-host-override"
          - "127.0.0.1"
          - "--miner-port-base"
          - "{{ node_rpc_base | string }}"
          - "--miner-port-step"
          - "{{ node_rpc_step | string }}"

    - name: Append shard-specific arguments
      ansible.builtin.set_fact:
        funding_setup_argv: "{{ funding_setup_argv + ['--shard', shard_spec] }}"
      vars:
        shard_spec: "id={{ item.id }},host=127.0.0.1:{{ wallet_rpc_base + (wallet_rpc_step * (loop_index + 1)) }},wallet={{ item.wallet_name }}"
      loop: "{{ txgen_shards }}"
      loop_control:
        index_var: loop_index

    - name: Execute funding setup
      ansible.builtin.command:
        argv: "{{ funding_setup_argv }}"
        chdir: "{{ workdir }}"
      environment:
        PYTHONUNBUFFERED: "1"
      register: funding_setup
      changed_when: true

    - name: Debug funding setup output
      ansible.builtin.debug:
        msg: "{{ funding_setup.stdout_lines }}"

    - name: Verify funding snapshot exists
      ansible.builtin.stat:
        path: "{{ workdir }}/state/funding_snapshot.json"
      register: funding_snapshot
      failed_when: not funding_snapshot.stat.exists

    - name: Start TxGen containers after successful funding setup
      ansible.builtin.shell: |
        docker compose -f {{ workdir }}/docker-compose.yml --profile txgen up -d txgen_{{ item.id }}
      args:
        chdir: "{{ workdir }}"
      loop: "{{ txgen_shards }}"
      changed_when: true
      register: txgen_start

    - name: Wait for TxGen containers to be running
      ansible.builtin.shell: |
        timeout=30
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          if docker ps --filter "name=txgen_{{ item.id }}" --format "{{ '{{.Names}}' }}" | grep -q "^txgen_{{ item.id }}$"; then
            echo "Container txgen_{{ item.id }} is running"
            exit 0
          fi
          sleep 1
          elapsed=$((elapsed + 1))
        done
        echo "Timeout waiting for txgen_{{ item.id }}"
        exit 1
      loop: "{{ txgen_shards }}"
      register: txgen_status
      changed_when: false

