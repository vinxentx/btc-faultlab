      - "/Users/vincenttietze/btc-faultlab/config/wallet/bitcoin.conf:/home/bitcoin/.bitcoin/bitcoin.conf:ro"
    networks: [ "btcnet" ]
    ports:
      - "21043:18443"
      - "21044:18444"
      - "31032:28332"
      - "31033:28333"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  txgen:
    image: "python:3.12-slim"
    container_name: "txgen"
    restart: unless-stopped
    user: "0:0"
    working_dir: /app
    volumes:
      - "/Users/vincenttietze/btc-faultlab/files:/app:ro"
      - "txlogs:/results"
    command: >
      bash -lc "pip install requests && python -u /app/txgen.py --rate 10
      --rpc http://user:pass@wallet:18443
      --log /results/txlog.csv
      --node-count 64
      --mining-percentage 0.08"
    depends_on:
      wallet:
        condition: service_healthy
    networks: [ "btcnet" ]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://user:pass@wallet:18443', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

