name: "btcnet"

services:
  node01:
    image: "bitcoin/bitcoin:27.0"
    container_name: "node01"
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["bitcoind"]
    command: 
      - "-regtest=1"
      - "-printtoconsole=1"
      - "-datadir=/home/bitcoin/.bitcoin"
      - "-server=1"
      - "-txindex=1"
      - "-rpcuser=user"
      - "-rpcpassword=pass"
      - "-rpcbind=0.0.0.0"
      - "-rpcallowip=0.0.0.0/0"
      - "-zmqpubhashblock=tcp://0.0.0.0:28332"
      - "-zmqpubhashtx=tcp://0.0.0.0:28333"
      - "-maxconnections=64"
      - "-discover=1"
      - "-dnsseed=0"
      - "-listen=1"
      # Core tier - dense mesh with spillover
      - "-connect=node09:18444"
    volumes:
      - "node01_data:/home/bitcoin/.bitcoin"
      - "/Users/vincenttietze/btc-faultlab/config/node01/bitcoin.conf:/home/bitcoin/.bitcoin/bitcoin.conf:ro"
    networks: [ "btcnet" ]
    ports:
      - "20443:18443"
      - "20444:18444"
      - "30332:28332"
      - "30333:28333"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
